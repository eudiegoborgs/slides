<h2 id="profiss%C3%B5es-deixam-de-existir-e-outras-nascem">Profissões deixam de existir e outras nascem</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<p>Exemplos não faltam:</p>
<ul>
<li>Com a <strong>prensa de Gutenberg</strong>, os <em>copiadores de livros sumiram</em>.</li>
<li>Com os <strong>automóveis</strong>, os <em>cocheiros perderam espaço</em>.</li>
<li>Com a <strong>internet</strong>, quantas <em>locadoras de vídeo fecharam?</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<p>E, mesmo assim, em todos esses contextos, os melhores seguiram relevantes:</p>
<ul>
<li>Ainda existem <strong>especialistas em caligrafia</strong>.</li>
<li><strong>Motoristas</strong> continuam existindo.</li>
<li><strong>Influencers de cinema</strong> são uma das <em>categorias mais antigas da internet</em>, com blogs e canais dedicados desde os anos 2000.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h4 id="n%C3%A3o-%C3%A9-o-fim-do-trabalho-%C3%A9-o-fim-do-repetitivo">não é o fim do trabalho, é o <code>fim do repetitivo</code></h4>
<p><em>já trabalhei em lugares em que existiam pessoas dedicadas a</em><br />
<em>transferir dados de uma planilha para outra.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<p><em>se o seu trabalho é repetitivo, se você só replica e não cria</em></p>
<h3 id="sinto-dizer-seus-dias-est%C3%A3o-contados">sinto dizer: seus dias estão contados</h3>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<p><em>E isso não é ruim. O mundo está exigindo um nível mais alto de entrega</em><br />
<em>— mais criativo, mais estratégico, <code>mais humano</code>.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<p><em>A IA não vai acabar com todas as profissões. Mas ela vai transformar profundamente como trabalhamos. O profissional que ignorar esse movimento vai ficar <code>obsoleto</code>.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<p><em>E isso vai impactar diversas profissões...</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<p><em>Para desenvolvedores, a IA vai automatizar boa parte do trabalho repetitivo, além de apoiar na pesquisa.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<p><em>Para artistas, uma vez que os conceitos de uma série, os detalhes de um personagem forem definidos, vai facilitar transformar esboços em artes finais detalhadas.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<p><em>Para nutricionistas, uma vez que compreendido o plano alimentar, um cardápio criativo pode ser criado; para o advogado, uma vez que tem a tese de defesa, um bom documento pode ser escrito, etc.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h2 id="m%C3%B3dulo-1">Módulo 1</h2>
<h3 id="a-mentalidade-ia-first--a-l%C3%B3gica-do-modelo">A Mentalidade IA First &amp; a Lógica do Modelo</h3>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h2 id="o-que-%C3%A9-intelig%C3%AAncia-artificial-generativa">O que é Inteligência Artificial Generativa?</h2>
<ul>
<li>IA tradicional: <strong>reconhece padrões</strong> <em>(classificar, detectar, recomendar)</em></li>
<li>IA Generativa: <strong>cria coisas novas</strong> a partir do que aprendeu</li>
<li>Textos, imagens, código, áudios — <strong>gerados do zero</strong></li>
<li>Pense como um estudante que leu a internet inteira e agora escreve</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h2 id="o-que-%C3%A9-uma-llm">O que é uma LLM?</h2>
<p><em>Large Language Model — Modelo de Linguagem de Grande Escala</em></p>
<ul>
<li>Um modelo treinado em <strong>bilhões de textos</strong> humanos</li>
<li>Aprendeu a <strong>prever qual palavra vem a seguir</strong> com altíssima precisão</li>
<li>ChatGPT, Gemini, Claude são LLMs</li>
<li><strong>Não pensa como humano</strong> — mas imita padrões de raciocínio com precisão assustadora</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h2 id="determin%C3%ADstico-vs-probabil%C3%ADstico">Determinístico vs Probabilístico</h2>
<ul>
<li><strong>Calculadora:</strong> <code>2 + 2 = 4</code> sempre, sem exceção <em>(determinístico)</em></li>
<li><strong>LLM:</strong> <em>&quot;Qual a melhor resposta aqui?&quot;</em> — calcula <strong>probabilidades</strong></li>
<li>Cada resposta é uma <strong>aposta estatística</strong> do modelo</li>
<li><strong>Por isso a mesma pergunta pode gerar respostas diferentes</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="o-que-isso-muda-para-o-seu-neg%C3%B3cio">O que isso muda para o seu negócio?</h3>
<ul>
<li>A IA <strong>não é uma máquina de regras</strong> — é uma máquina de probabilidades</li>
<li>Instrução vaga ➔ ela aposta em qualquer direção</li>
<li>Instrução precisa ➔ ela aposta no caminho certo</li>
<li><strong>Quem controla a instrução, controla o resultado</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="o-caso-de-gerivaldo-jubiscreudo">O Caso de Gerivaldo Jubiscreudo</h3>
<ul>
<li>Adotou IA no trabalho e no dia a dia</li>
<li>Corrige textos, busca informações e tira dúvidas</li>
<li>Usa o resultado para compor sua rotina</li>
<li>Sente que a IA é &quot;legalzinha&quot;</li>
<li><strong>Mas não vê ganhos gigantescos no negócio</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="o-erro-comum-de-gerivaldo">O Erro Comum de Gerivaldo</h3>
<ul>
<li>Usa apenas uma parte pequena do potencial</li>
<li>Trata a IA como um <code>Auto-Complete</code></li>
<li>Usa como um &quot;Google glorificado&quot;</li>
<li><strong>Resultado:</strong> Ganho raso e superficial</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="e-se-ele-usasse-como-o-jarvis">E se ele usasse como o <code>Jarvis</code>?</h3>
<p><em>O Jarvis do Homem de Ferro não é um buscador</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="ia-como-parceiro-de-trabalho">IA como <code>Parceiro de Trabalho</code></h3>
<ul>
<li>Não peça apenas a resposta final</li>
<li><strong>Discuta o problema:</strong> Traga suas dúvidas e dilemas</li>
<li><strong>Inseguranças do negócio?</strong> Coloque na mesa!</li>
<li>Peça para a IA questionar suas premissas</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="de-digitador-a-diretor">De Digitador a Diretor</h3>
<ul>
<li><strong>Antes:</strong> Fazer tudo do zero sozinho <em>(gargalo braçal)</em></li>
<li><strong>IA First:</strong> IA faz 80% do trabalho bruto</li>
<li><strong>Você:</strong> Julgamento, contexto e 20% de refino humano</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="mudando-a-pergunta-chave">Mudando a Pergunta Chave</h3>
<ul>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> <em>&quot;Como eu vou escrever isso do zero?&quot;</em></li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> <em>&quot;A IA pode rascunhar a 1ª versão disso?&quot;</em></li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> <em>&quot;Que caminhos eu não estou enxergando?&quot;</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="exemplo-pr%C3%A1tico-na-rotina-real">Exemplo Prático: Na Rotina Real</h3>
<ul>
<li>
<p><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>Modo Digitador (Superficial):</strong><br />
<em>&quot;Escreva um post vendendo meu produto X.&quot;</em></p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>Modo Jarvis (Parceiro IA First):</strong><br />
<em>&quot;Tenho estoque parado do produto X. Qual estratégia me sugere discutir para vender neste fim de semana antes de criarmos as peças?&quot;</em></p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="e-quando-a-ia-errar-n%C3%A3o-desista">E quando a IA errar? Não desista!</h3>
<ul>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>Não diga:</strong> <em>&quot;Essa ferramenta não funciona&quot;</em></li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>Ajuste o fluxo com feedback:</strong>
<ul>
<li><em>&quot;Gostaria que tivesse chegado a ESTE resultado...&quot;</em></li>
<li><em>&quot;Onde ajustamos o processo para acertar sempre?&quot;</em></li>
</ul>
</li>
<li><strong>Erro da IA = Falha na instrução, não na tecnologia!</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h2 id="e-se-o-trabalho-fosse-de-gra%C3%A7a">E se o trabalho fosse de graça?</h2>
<p><em>Se qualquer ideia pudesse virar algo funcional em horas:</em></p>
<ul>
<li><strong>O que você construiria?</strong></li>
<li><strong>E o que te impede de fazer isso agora?</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h2 id="cultura-do-erro-r%C3%A1pido">Cultura do Erro Rápido</h2>
<ul>
<li><strong>Antes:</strong> Testar ideias custava caro e demorava semanas</li>
<li><strong>Com IA:</strong> <strong>Ideia ➔ Prompt ➔ Teste em 30s</strong></li>
<li><strong>Princípio:</strong> Errar rápido para acertar barato</li>
<li>Custo de testar uma hipótese? <strong>Zero reais.</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="exemplo-testando-uma-oferta">Exemplo: Testando uma Oferta</h3>
<ul>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>Tradicional:</strong> Gastar R$ 2.000 e 3 semanas criando uma campanha sem certeza de vendas.</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>IA First:</strong> Gerar 5 abordagens de oferta em 30s e testar com 10 clientes no WhatsApp antes de gastar R$ 1.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h2 id="o-que-s%C3%A3o-tokens">O que são Tokens?</h2>
<p><em>A &quot;moeda&quot; e a memória da IA</em></p>
<ul>
<li>A IA não lê palavras inteiras, lê <strong>tokens</strong></li>
<li><strong>100 tokens</strong> ≈ 75 palavras em português</li>
<li>Pense em tokens como <strong>fichas de consumo</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="o-problema-dos-tokens-no-dia-a-dia">O Problema dos Tokens no Dia a Dia</h3>
<ul>
<li><strong>Custo:</strong> Prompts com &quot;enrolação&quot; gastam mais fichas</li>
<li><strong>Perda de Foco:</strong> Prompts gigantes pulverizam a atenção</li>
<li><strong>Resultado:</strong> Respostas lentas, caras e imprecisas</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>Solução:</strong> Seja direto, claro e objetivo</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h2 id="janela-de-contexto">Janela de Contexto</h2>
<p><em>A memória limite do chat</em></p>
<ul>
<li>É o <strong>quadro-negro</strong> da IA naquele chat</li>
<li>Conforme o chat cresce, ela apaga o topo</li>
<li>A IA <strong>não tem memória infinita</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="o-perigo-do-chat-infinito">O Perigo do &quot;Chat Infinito&quot;</h3>
<ul>
<li><strong>Amnésia:</strong> A IA esquece regras ditas no início</li>
<li><strong>Contaminação:</strong> Mistura assuntos diferentes no mesmo chat</li>
<li><strong>Alucinação:</strong> Começa a inventar preços e prazos!</li>
<li><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6e1.svg" data-marp-twemoji=""/> <strong>Regra de Ouro:</strong> 1 Chat = 1 Objetivo Específico</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h2 id="%E2%9C%8F%EF%B8%8F-exerc%C3%ADcio-pr%C3%A1tico-1"><img class="emoji" draggable="false" alt="✏️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/270f.svg" data-marp-twemoji=""/> Exercício Prático 1</h2>
<h3 id="mapeamento-de-processos-10-min">Mapeamento de Processos (10 min)</h3>
<ul>
<li>Mapear <strong>3 tarefas repetitivas</strong></li>
<li>Escolher a <strong>nº 1 mais urgente</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h2 id="m%C3%B3dulo-2">Módulo 2</h2>
<h3 id="a-arte-de-orientar-a-ia-prompt--spec-driven">A Arte de Orientar a IA: Prompt &amp; Spec Driven</h3>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="%F0%9F%A7%AA-experimento-pr%C3%A1tico-1"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Experimento Prático #1</h3>
<p><strong>Digite o seguinte comando para a IA:</strong></p>
<blockquote>
<p><em>&quot;Me dê um número aleatório.&quot;</em></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="o-seu-resultado-foi-42-ou-73-%F0%9F%A4%94">O seu resultado foi 42 ou 73? <img class="emoji" draggable="false" alt="🤔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f914.svg" data-marp-twemoji=""/></h3>
<ul>
<li><strong>42:</strong> <em>A resposta para a vida, o universo e tudo mais</em> (Guia dos Mochileiros da Galáxia)</li>
<li><strong>73:</strong> <em>O número perfeito do Sheldon</em> (The Big Bang Theory)</li>
</ul>
<p><strong>Por que a IA escolhe esses números?</strong></p>
<ul>
<li>A IA calcula <strong>probabilidades estatísticas</strong>, não aleatoriedade pura</li>
<li>42 e 73 aparecem desproporcionalmente na internet</li>
<li><strong>Sem instrução específica, a IA recorre ao viés do treinamento</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="%F0%9F%A7%AA-experimento-pr%C3%A1tico-2"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Experimento Prático #2</h3>
<p><strong>Digite o seguinte comando para a IA:</strong></p>
<blockquote>
<p><em>&quot;O que significa esonspasnassavas?&quot;</em></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="%F0%9F%A7%AA-experimento-pr%C3%A1tico-3"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Experimento Prático #3</h3>
<p><strong>Agora digite o seguinte comando para a IA:</strong></p>
<blockquote>
<p><em>&quot;O que significa esonspasnassavas no dialeto mineiro de belo horizonte?&quot;</em></p>
</blockquote>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <em>(Resposta: &quot;Esse ônibus passa na Savassi?&quot;)</em> <img class="emoji" draggable="false" alt="🚌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f68c.svg" data-marp-twemoji=""/></li>
<li><strong>O contexto muda tudo:</strong> A instrução certa destrava o conhecimento exato do modelo!</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="por-que-os-prompts-falham">Por que os Prompts falham?</h3>
<ul>
<li>A IA só funciona quando você sabe <strong>o que</strong> e <strong>como</strong> pedir</li>
<li>Sem instrução precisa, ela tenta &quot;adivinhar&quot;</li>
<li><strong>Resultado:</strong> Textos genéricos ou entregas desalinhadas</li>
<li><strong>A regra de ouro:</strong> Quem pede mal, recebe mal</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;--marpit-advanced-background-split:35%;" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;./assets/bug.png&quot;);"></figure></div></section></foreignObject><foreignObject width="65%" height="720"><section id="49" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;--marpit-advanced-background-split:35%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="quando-o-prompt-n%C3%A3o-basta">Quando o Prompt Não Basta</h3>

<p><em>Prompt:</em> <em>&quot;Faça uma imagem de quadrinhos do Diego lendo um livro cuja a capa diz 'como corrigir bugs', ele abre o livro e na primeira página está escrito 'criando'&quot;</em></p>
<ul>
<li>O prompt <strong>parecia bom</strong> — era claro e detalhado</li>
<li>Mas havia outros problemas ocultos</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-theme="eudiegoborgs" lang="C" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="os-problemas-invis%C3%ADveis-desse-prompt">Os Problemas Invisíveis desse Prompt</h3>
<ul>
<li><img class="emoji" draggable="false" alt="💬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4ac.svg" data-marp-twemoji=""/> <strong>Chat compartilhado:</strong> A sessão carregava contextos de outras conversas</li>
<li><img class="emoji" draggable="false" alt="🧠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9e0.svg" data-marp-twemoji=""/> <strong>Contaminação de memória:</strong> A IA trouxe referências de imagens anteriores não relacionadas</li>
<li><img class="emoji" draggable="false" alt="🔎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50e.svg" data-marp-twemoji=""/> <strong>O óbvio precisava ser dito:</strong> Cor do cabelo, estilo, posição, ângulo — nada estava na instrução</li>
<li><strong>Mesmo um prompt bem escrito pode falhar sem isolamento de contexto</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>1. Prompt Ruim (Vago &amp; Raso)</strong></p>
<ul>
<li><em>&quot;Escreva um e-mail de vendas para minha loja.&quot;</em></li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> Sem contexto, sem papel, sem público</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> Resultado: Texto robótico que ninguém lê</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<p><img class="emoji" draggable="false" alt="🟡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e1.svg" data-marp-twemoji=""/> <strong>2. Prompt Bom (Tem Tarefa e Público)</strong></p>
<ul>
<li><em>&quot;Escreva um e-mail para clientes antigos divulgando a promoção de sapatos do fim de semana.&quot;</em></li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Melhor, mas ainda falta tom de voz, formato e regras</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<p><img class="emoji" draggable="false" alt="🟢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e2.svg" data-marp-twemoji=""/> <strong>3. Prompt Ótimo (P.C.T.F.R.)</strong></p>
<ul>
<li><strong>Papel:</strong> Copywriter Sênior de Varejo</li>
<li><strong>Contexto:</strong> Loja de sapatos com estoque feminino parado</li>
<li><strong>Tarefa:</strong> E-mail de reativação de clientes VIP</li>
<li><strong>Formato:</strong> Assunto chamativo + 3 parágrafos + Botão PIX</li>
<li><strong>Restrições:</strong> Tom amigável, sem gírias, max 150 palavras</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h2 id="a-f%C3%B3rmula-pctfr">A Fórmula P.C.T.F.R.</h2>
<ul>
<li><strong>P</strong>apel <em>(Quem a IA deve ser)</em></li>
<li><strong>C</strong>ontexto <em>(O cenário do negócio)</em></li>
<li><strong>T</strong>arefa <em>(O que fazer)</em></li>
<li><strong>F</strong>ormato <em>(Como entregar)</em></li>
<li><strong>R</strong>estrições <em>(Regras e limites)</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h2 id="t%C3%A9cnicas-avan%C3%A7adas">Técnicas Avançadas</h2>
<ul>
<li><strong>Few-Shot:</strong> Dar 1 ou 2 exemplos reais</li>
<li><strong>Chain-of-Thought:</strong> Fazer a IA pensar passo a passo</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="o-problema-que-a-spec-resolve">O problema que a Spec resolve</h3>
<p><em>Você tem um prompt ótimo, mas...</em></p>
<ul>
<li>A IA <strong>não conhece suas regras</strong> de negócio</li>
<li>Ela <strong>inventa</strong> prazos, preços e políticas que não existem</li>
<li>Cada vez que abre um chat novo, <strong>começa do zero</strong></li>
<li>Sua equipe não sabe <strong>como a IA deve se comportar</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="spec-driven-development">Spec Driven Development</h3>
<p><em>O manual de instrução do processo do seu negócio</em></p>
<ul>
<li>Escreva <strong>as regras antes</strong> de pedir a execução</li>
<li>A IA para de adivinhar e passa a <strong>obedecer</strong></li>
<li><strong>Fluxo:</strong> Spec ➔ Prompt ➔ Execução Perfeita</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="a-regra-de-ouro-da-spec">A Regra de Ouro da Spec</h3>
<ul>
<li>Tarefa simples ➔ Spec curta está ótimo</li>
<li>Tarefa complexa ➔ Spec incompleta = resultado ruim</li>
<li><strong>Quanto maior a tarefa, melhor deve ser a Spec</strong></li>
<li>Se a entrega importa, a instrução precisa ser completa</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="frameworks-para-escrever-sua-spec">Frameworks para escrever sua Spec</h3>
<p><em>Não precisa reinventar a roda — existem modelos consagrados</em></p>
<ul>
<li><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cb.svg" data-marp-twemoji=""/> <strong>User Story</strong> — simples, foco no objetivo</li>
<li><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4d0.svg" data-marp-twemoji=""/> <strong>PRD</strong> — detalhado, para processos complexos</li>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>JTBD</strong> — foco na dor e no resultado esperado</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>BDD (Given/When/Then)</strong> — perfeito para agentes e automações</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="%F0%9F%93%8B-user-story"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cb.svg" data-marp-twemoji=""/> User Story</h3>
<p><em>&quot;Como [quem], quero [o quê], para [por quê]&quot;</em></p>
<blockquote>
<p><em>&quot;Como atendente do WhatsApp,</em><br />
<em>quero responder dúvidas sobre preços e prazos,</em><br />
<em>para fechar pedidos sem depender do dono.&quot;</em></p>
</blockquote>
<ul>
<li>Direto ao ponto — ideal para <strong>tarefas simples e únicas</strong></li>
<li>Fácil de escrever em qualquer ferramenta</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="%F0%9F%93%90-prd-product-requirements-document"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4d0.svg" data-marp-twemoji=""/> PRD (Product Requirements Document)</h3>
<p><em>Para processos mais complexos e recorrentes</em></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-markdown"><span class="hljs-section">## Objetivo</span>
<span class="hljs-section">## Contexto do Negócio</span>
<span class="hljs-section">## Regras Obrigatórias (o que DEVE acontecer)</span>
<span class="hljs-section">## Restrições (o que NÃO pode acontecer)</span>
<span class="hljs-section">## Exemplo de entrada e saída esperada</span>
</code></pre>
<ul>
<li>Mais completo que a User Story</li>
<li>Ideal para <strong>agentes fixos e automações</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="%F0%9F%8E%AF-jtbd-jobs-to-be-done"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> JTBD (Jobs To Be Done)</h3>
<p><em>Foco na dor e no resultado — não na função</em></p>
<blockquote>
<p><em>&quot;Quando [situação],</em><br />
<em>eu preciso [motivação real],</em><br />
<em>para que [resultado desejado].&quot;</em></p>
</blockquote>
<blockquote>
<p><em>&quot;Quando um cliente pergunta o preço no Instagram,</em><br />
<em>preciso responder rápido e com confiança,</em><br />
<em>para que não vá comprar no concorrente.&quot;</em></p>
</blockquote>
<ul>
<li>Conecta o processo à <strong>dor real do negócio</strong></li>
<li>Excelente ponto de partida antes de escrever o PRD</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="%E2%9C%85-bdd--given--when--then"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> BDD — Given / When / Then</h3>
<p><em>Ideal para agentes com regras condicionais</em></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-markdown">DADO QUE o cliente perguntar sobre desconto
QUANDO o valor do pedido for abaixo de R$ 300
ENTÃO responder que não há desconto disponível

QUANDO o valor for igual ou acima de R$ 300
ENTÃO oferecer 5% de desconto no PIX
</code></pre>
<ul>
<li>Transforma regras de negócio em <strong>lógica clara para a IA</strong></li>
<li>Evita respostas ambíguas em situações com múltiplas condições</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="rag--sua-ia-com-mem%C3%B3ria-de-busca">RAG — Sua IA com memória de busca</h3>
<p><em>Retrieval Augmented Generation</em></p>
<ul>
<li>O Agente <strong>não depende só do que foi treinado</strong></li>
<li>Antes de responder, ele <strong>busca nos seus documentos</strong>:
<ul>
<li>Catálogo de produtos</li>
<li>Tabela de preços atualizada</li>
<li>Histórico de atendimentos</li>
<li>Políticas internas</li>
</ul>
</li>
<li><strong>Resultado:</strong> respostas baseadas na realidade do seu negócio</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="rag-na-linguagem-do-microempreendedor">RAG na linguagem do microempreendedor</h3>
<ul>
<li>O próximo nível: o Agente <strong>busca automaticamente</strong> nos seus arquivos</li>
<li>Exemplo: <em>&quot;Qual o prazo de entrega para o interior do Ceará?&quot;</em>
<ul>
<li>Sem RAG ➔ IA inventa ou pede que você informe</li>
<li>Com RAG ➔ IA consulta sua tabela de logística e responde com precisão</li>
</ul>
</li>
<li><strong>Não precisa de programação</strong> — basta anexar seus documentos no ChatGPT</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="onde-o-rag-se-encaixa-no-seu-neg%C3%B3cio">Onde o RAG se encaixa no seu negócio?</h3>
<table>
<thead>
<tr>
<th>Situação</th>
<th>Sem RAG</th>
<th>Com RAG</th>
</tr>
</thead>
<tbody>
<tr>
<td>Preço de produto</td>
<td>&quot;Em torno de R$ X&quot;</td>
<td>Valor exato do catálogo</td>
</tr>
<tr>
<td>Prazo de entrega</td>
<td>&quot;Normalmente X dias&quot;</td>
<td>Regra real da sua tabela</td>
</tr>
<tr>
<td>Política de troca</td>
<td>Resposta genérica</td>
<td>Sua política palavra a palavra</td>
</tr>
<tr>
<td>Histórico do cliente</td>
<td>Não tem acesso</td>
<td>Consulta o CRM ou planilha</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="%F0%9F%93%9A-demo-rag-r%C3%A1pido-no-chatgpt"><img class="emoji" draggable="false" alt="📚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4da.svg" data-marp-twemoji=""/> Demo: RAG rápido no ChatGPT</h3>
<p><em>Sem configurar nada — funciona direto no chat</em></p>
<p><strong>Passo 1 — Prepare seus documentos:</strong></p>
<blockquote>
<ul>
<li>Tabela de preços em PDF, Excel ou <code>.txt</code></li>
<li>Catálogo de produtos ou política de atendimento</li>
<li>Qualquer arquivo texto com as regras do seu negócio</li>
</ul>
</blockquote>
<p><strong>Passo 2 — No ChatGPT, clique no <img class="emoji" draggable="false" alt="📎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4ce.svg" data-marp-twemoji=""/> antes de digitar:</strong></p>
<blockquote>
<p>Anexe o arquivo → faça sua pergunta normalmente<br />
<em>&quot;Com base no arquivo anexado, qual o prazo de entrega para SP capital?&quot;</em></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="%F0%9F%93%9A-demo-rag-no-chatgpt--configurando"><img class="emoji" draggable="false" alt="📚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4da.svg" data-marp-twemoji=""/> Demo: RAG no ChatGPT — configurando</h3>
<p><strong>Passo 3 — Teste com perguntas reais do seu negócio:</strong></p>
<blockquote>
<p><em>&quot;Minha política permite troca após 30 dias?&quot;</em><br />
<em>&quot;Quais produtos têm margem acima de 40%?&quot;</em><br />
<em>&quot;Qual o preço do produto Y no atacado?&quot;</em></p>
</blockquote>
<ul>
<li>O ChatGPT lê o arquivo e responde com base nele</li>
<li>Funciona com PDF, Excel, Word, CSV e <code>.txt</code></li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>Limite:</strong> o arquivo só existe nessa sessão — no próximo chat, some</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="%F0%9F%93%9A-demo-rag-permanente-com-custom-gpt"><img class="emoji" draggable="false" alt="📚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4da.svg" data-marp-twemoji=""/> Demo: RAG permanente com Custom GPT</h3>
<p><em>Para quem quer um Agente fixo que sempre consulta seus docs</em></p>
<p><strong>Passo 1 — Acesse <code>chatgpt.com</code> → Explorar GPTs → Criar</strong></p>
<p><strong>Passo 2 — Cole o System Prompt da Skill:</strong></p>
<blockquote>
<p><em>&quot;Você é consultora de vendas da Empresa X. Antes de responder qualquer dúvida sobre preços, prazos ou produtos, consulte os arquivos anexados e responda apenas com base neles.&quot;</em></p>
</blockquote>
<p><strong>Passo 3 — Vá em 'Conhecimento' → Fazer upload dos seus documentos</strong></p>
<p><strong>Resultado:</strong> GPT que sempre consulta seus docs — em qualquer chat</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="%F0%9F%93%9A-demo-validando-se-o-rag-est%C3%A1-funcionando"><img class="emoji" draggable="false" alt="📚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4da.svg" data-marp-twemoji=""/> Demo: Validando se o RAG está funcionando</h3>
<p><em>Como saber se a IA está buscando nos seus docs ou inventando?</em></p>
<p><strong>Teste 1 — Pergunta com resposta nos seus docs:</strong></p>
<blockquote>
<p><em>&quot;Qual o prazo de entrega para SP capital?&quot;</em><br />
<img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Deve citar o valor exato da sua tabela</p>
</blockquote>
<p><strong>Teste 2 — Pergunta que NÃO está nos docs:</strong></p>
<blockquote>
<p><em>&quot;Qual o melhor produto para presente de casamento?&quot;</em><br />
<img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Deve dizer que não encontrou nos documentos disponíveis<br />
<img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> Se inventar uma resposta — a instrução precisa de restrição</p>
</blockquote>
<p><strong>Regra:</strong> <em>&quot;Responda apenas com base nos documentos. Se não encontrar, diga: não tenho essa informação no momento.&quot;</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="recapitulando-o-que-j%C3%A1-aprendemos">Recapitulando o que já aprendemos</h3>
<ul>
<li><img class="emoji" draggable="false" alt="💬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4ac.svg" data-marp-twemoji=""/> <strong>Prompt com contexto</strong> → a IA aposta na direção certa, não em qualquer direção</li>
<li><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cb.svg" data-marp-twemoji=""/> <strong>SDD</strong> → documenta as regras do jogo antes de pedir a execução</li>
<li><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50d.svg" data-marp-twemoji=""/> <strong>RAG</strong> → conecta a IA aos seus documentos reais, tornando as respostas mais determinísticas</li>
</ul>
<p><em>Cada camada reduz a margem de erro da IA. Mas ainda há um problema...</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="mas-e-se-a-ia-esquecer-tudo-a-cada-chat">Mas e se a IA &quot;esquecer&quot; tudo a cada chat?</h3>
<p><em>Tudo isso some quando você abre um novo chat</em></p>
<ul>
<li>Cada chat novo começa <strong>sem memória</strong></li>
<li>Suas regras, tom de voz e processos somem</li>
<li>Você repete o mesmo contexto <strong>toda vez</strong></li>
<li><strong>E se a IA pudesse carregar tudo isso automaticamente?</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="criando-mem%C3%B3ria-permanente-com-specs-em-md">Criando Memória Permanente com Specs em <code>.md</code></h3>
<ul>
<li>Crie uma <strong>pasta</strong> <code><img class="emoji" draggable="false" alt="📁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c1.svg" data-marp-twemoji=""/> memoria-ia/</code> no seu projeto</li>
<li>Organize em <strong>subpastas temáticas</strong>:
<ul>
<li><code><img class="emoji" draggable="false" alt="📁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c1.svg" data-marp-twemoji=""/> marca/</code> → tom de voz, identidade, valores</li>
<li><code><img class="emoji" draggable="false" alt="📁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c1.svg" data-marp-twemoji=""/> comercial/</code> → preços, descontos, políticas</li>
<li><code><img class="emoji" draggable="false" alt="📁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c1.svg" data-marp-twemoji=""/> processos/</code> → atendimento, entregas, regras</li>
</ul>
</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>Revise o conteúdo regularmente</strong> para evitar alucinações</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="como-usar-a-pasta-de-mem%C3%B3ria">Como usar a pasta de memória</h3>
<ul>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>Não anexe</strong> os arquivos em cada chat</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>Referencie o caminho</strong> nas instruções do Agente:
<ul>
<li><em>&quot;Antes de responder, consulte as regras em <code>memoria-ia/comercial/politicas.md</code>&quot;</em></li>
</ul>
</li>
<li><img class="emoji" draggable="false" alt="👥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f465.svg" data-marp-twemoji=""/> <strong>Quem mantém?</strong> Você revisa, a IA aprende — nunca o contrário</li>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h2 id="o-que-%C3%A9-uma-skill">O que é uma Skill?</h2>
<ul>
<li>Uma <strong>Skill</strong> é uma capacidade empacotada e reutilizável para um Agente</li>
<li>Combina três camadas:
<ul>
<li><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cb.svg" data-marp-twemoji=""/> <strong>Instrução</strong> — o que o agente deve fazer <em>(parece SDD, mas não é igual)</em></li>
<li><img class="emoji" draggable="false" alt="📚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4da.svg" data-marp-twemoji=""/> <strong>Base de conhecimento</strong> — o que ele precisa saber para fazer</li>
<li><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6e0.svg" data-marp-twemoji=""/> <strong>Ferramenta</strong> — como ele executa mecanicamente <em>(script, API, busca)</em></li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="skill-vs-spec-driven-development">Skill vs Spec Driven Development</h3>
<table>
<thead>
<tr>
<th></th>
<th><strong>SDD</strong></th>
<th><strong>Skill</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>O que é</strong></td>
<td>Documento de regras</td>
<td>Capacidade instalada</td>
</tr>
<tr>
<td><strong>Para quem</strong></td>
<td>Para o prompt</td>
<td>Para o Agente</td>
</tr>
<tr>
<td><strong>Escopo</strong></td>
<td>Uma tarefa</td>
<td>Uso recorrente</td>
</tr>
<tr>
<td><strong>Atualiza</strong></td>
<td>Você edita o texto</td>
<td>Você versiona a Skill</td>
</tr>
</tbody>
</table>
<p><em>SDD descreve <strong>o que fazer</strong>. A Skill <strong>é o que fazer</strong> — pronto para usar.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="scripts-program%C3%A1veis-dentro-de-skills">Scripts programáveis dentro de Skills</h3>
<ul>
<li>Skills podem executar <strong>código real</strong> durante a resposta</li>
<li>Exemplos práticos para microempreendedores:
<ul>
<li><img class="emoji" draggable="false" alt="🧮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ee.svg" data-marp-twemoji=""/> Calcular margem de lucro com base na planilha do estoque</li>
<li><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4ca.svg" data-marp-twemoji=""/> Gerar gráfico de vendas do mês automaticamente</li>
<li><img class="emoji" draggable="false" alt="📩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4e9.svg" data-marp-twemoji=""/> Buscar o último pedido do cliente por CPF ou nome</li>
</ul>
</li>
<li>O agente <strong>não chuta</strong> — ele <strong>executa e traz o dado real</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="como-funciona-na-pr%C3%A1tica">Como funciona na prática?</h3>
<p><em>Sem script:</em></p>
<blockquote>
<p><em>&quot;Seu lucro médio é em torno de 30% aproximadamente...&quot;</em> <img class="emoji" draggable="false" alt="😬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f62c.svg" data-marp-twemoji=""/></p>
</blockquote>
<p><em>Com script na Skill:</em></p>
<blockquote>
<p><em>&quot;Calculei sua planilha: margem atual é 23,4%. Abaixo da meta de 30%.</em><br />
<em>Produtos com menor margem: Produto A (8%) e Produto B (12%).&quot;</em> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></p>
</blockquote>
<ul>
<li>A IA deixa de <strong>estimar</strong> e passa a <strong>calcular</strong></li>
<li>Isso é o Jarvis funcionando de verdade</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="%F0%9F%9B%A0%EF%B8%8F-demo-criando-uma-skill-com-ia"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6e0.svg" data-marp-twemoji=""/> Demo: Criando uma Skill com IA</h3>
<p><em>Vamos criar juntos uma Skill de Proposta Comercial</em></p>
<p><strong>Passo 1 — Defina o problema em uma frase:</strong></p>
<blockquote>
<p><em>&quot;Quero que minha IA gere propostas comerciais profissionais para meus clientes, usando minha tabela de preços e meu tom de voz.&quot;</em></p>
</blockquote>
<p><strong>Passo 2 — Peça para a IA montar a Skill:</strong></p>
<blockquote>
<p><em>&quot;Com base nessa descrição, me ajude a criar a instrução completa, a lista do que ela precisa saber e o que eu devo fornecer em cada uso.&quot;</em></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="%F0%9F%9B%A0%EF%B8%8F-demo-o-que-a-ia-vai-te-entregar"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6e0.svg" data-marp-twemoji=""/> Demo: O que a IA vai te entregar</h3>
<p><em>A IA estrutura as 3 camadas automaticamente:</em></p>
<p><strong><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cb.svg" data-marp-twemoji=""/> Instrução (System Prompt)</strong></p>
<blockquote>
<p><em>&quot;Você é especialista em propostas comerciais da Empresa X. Com base nas informações do cliente e na tabela de preços fornecida, gere uma proposta clara, objetiva e no tom consultivo da marca.&quot;</em></p>
</blockquote>
<p><strong><img class="emoji" draggable="false" alt="📚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4da.svg" data-marp-twemoji=""/> Base de conhecimento</strong></p>
<blockquote>
<p>Tabela de preços · Diferenciais do serviço · Tom de voz da marca</p>
</blockquote>
<p><strong><img class="emoji" draggable="false" alt="📥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4e5.svg" data-marp-twemoji=""/> O que você fornece a cada uso</strong></p>
<blockquote>
<p>Nome do cliente · Necessidade relatada · Prazo desejado</p>
</blockquote>

<td>Uma tarefa específica</td>

</tr>
<tr>
<td><strong>Tem memória?</strong></td>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="91" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="o-que-cada-um-resolve">O que cada um resolve?</h3>
<p><strong>Skill resolve:</strong> <em>&quot;Preciso executar isso de forma padronizada&quot;</em></p>
<blockquote>
<p>Gerar proposta · Revisar texto · Calcular margem</p>
</blockquote>
<p><strong>Agente resolve:</strong> <em>&quot;Preciso de alguém que entenda o contexto e decida o próximo passo&quot;</em></p>
<blockquote>
<p>Atender cliente → entender a dor → recomendar → escalar se necessário</p>
</blockquote>
<ul>
<li>Skill é <strong>execução</strong></li>
<li>Agente é <strong>julgamento + execução</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="92" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="agente-gen%C3%A9rico-vs-agente-espec%C3%ADfico">Agente Genérico vs Agente Específico</h3>
<p><em>O erro mais comum: criar um agente que faz tudo</em></p>
<p><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>Agente Genérico</strong></p>
<blockquote>
<p><em>&quot;Você é um assistente inteligente que ajuda com qualquer coisa da empresa.&quot;</em><br />
→ Confuso · Inconsistente · Perde o fio com contexto longo</p>
</blockquote>
<p><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>Agente Específico</strong></p>
<blockquote>
<p><em>&quot;Você é especialista em propostas comerciais. Seu único trabalho é transformar o briefing do cliente em uma proposta profissional.&quot;</em><br />
→ Focado · Previsível · Fácil de testar e corrigir</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="93" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
<h3 id="por-que-agentes-espec%C3%ADficos-s%C3%A3o-mais-coerentes">Por que agentes específicos são mais coerentes?</h3>
<ul>
<li>A IA tem menos variáveis para equilibrar</li>
<li>O System Prompt fica <strong>curto, claro e sem contradições</strong></li>
<li>Fica fácil saber <strong>quando ele errou e por quê</strong></li>
<li>É simples <strong>treinar quem vai usar</strong> o agente</li>
<li><strong>Regra:</strong> Um agente, um papel, uma responsabilidade</li>
</ul>
</section>

<h3 id="%F0%9F%93%A6-distribuindo-agentes-via-zip"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4e6.svg" data-marp-twemoji=""/> Distribuindo Agentes via ZIP</h3>

<h3 id="%F0%9F%93%A6-como-instalar-o-agente-do-zip"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4e6.svg" data-marp-twemoji=""/> Como instalar o agente do ZIP</h3>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="104" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">

<span class="hljs-section">## Historico de versoes</span>
<span class="hljs-bullet">-</span> v1.2: Adicionada regra de desconto progressivo
<span class="hljs-bullet">-</span> v1.0: Versao inicial
</code></pre>

<h3 id="%F0%9F%94%8C-mcp-o-protocolo-que-conecta-sua-ia-a-tudo"><img class="emoji" draggable="false" alt="🔌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50c.svg" data-marp-twemoji=""/> MCP: O Protocolo que Conecta sua IA a Tudo</h3>
<p><em>Model Context Protocol</em></p>
<ul>
<li>O padrão universal para <strong>conectar a IA aos seus sistemas</strong></li>
<li>A IA deixa de apenas conversar e passa a <strong>acessar seus dados reais</strong></li>
<li>Integrações nativas com Google Drive, Notion, Slack, CRM e Bancos de Dados</li>
<li><strong>Grandes plataformas já disponibilizam MCPs prontos</strong></li>
<li>Não precisa programar: <strong>basta pedir para a própria IA se integrar</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="109" data-theme="eudiegoborgs" lang="C" style="--theme:eudiegoborgs;">
